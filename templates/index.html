<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bot_name }} - Culinary Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Karla:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --steel: #d3d9de;
      --steel-dark: #9aa5ae;
      --navy: #1f3a68;
      --chili: #d62d20;
      --paper: #fffef6;
      --ink: #1b2436;
      --ink-soft: #5f6b7d;
      --display: "Fraunces", Georgia, serif;
      --body: "Karla", "Segoe UI", sans-serif;
      --ticket: "Courier Prime", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--body);
      font-size: 16.5px;
      line-height: 1.55;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.18) 0 1px, transparent 1px 4px),
        var(--steel);
      display: flex;
      justify-content: center;
      padding: 22px;
    }

    .kitchen {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 0 6px 14px; }

    .head h1 {
      font-family: var(--display);
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--navy);
    }

    .head p { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }

    .reset {
      font-family: var(--body);
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      background: transparent;
      border: 2px solid var(--navy);
      border-radius: 8px;
      padding: 6px 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .reset:hover, .reset:focus-visible { background: var(--navy); color: #fff; outline: none; }

    .rail {
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(#f4f7f9, var(--steel-dark) 55%, #7d8891);
      box-shadow: 0 3px 0 rgba(31, 58, 104, 0.18);
      position: relative;
      z-index: 2;
    }

    .hanging {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 16px 14px;
      margin-top: -2px;
    }

    .slip {
      position: relative;
      flex-shrink: 0;
      font-family: var(--ticket);
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      color: var(--ink);
      background: var(--paper);
      border: none;
      border-top: 5px solid var(--chili);
      padding: 14px 16px 18px;
      cursor: pointer;
      transform-origin: top center;
      -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 7px repeat-x;
      mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 7px repeat-x;
      transition: transform 0.2s;
    }

    .slip:nth-child(odd) { transform: rotate(-1.2deg); }
    .slip:nth-child(even) { transform: rotate(0.9deg); }
    .slip:hover, .slip:focus-visible { transform: rotate(0deg) translateY(3px); outline: none; }

    .pass {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.55);
      border: 3px solid var(--steel-dark);
      border-radius: 14px;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .msg { max-width: 84%; }
    .msg.user { align-self: flex-end; }

    .bubble { overflow-wrap: anywhere; }

    .msg.bot .bubble {
      background: #fff;
      border: 5px solid var(--navy);
      border-radius: 20px 20px 20px 4px;
      padding: 12px 20px;
      box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #c4cfe6;
    }

    .msg.user .bubble {
      font-family: var(--ticket);
      font-size: 15.5px;
      font-weight: 700;
      background: var(--paper);
      border-top: 5px solid var(--chili);
      padding: 14px 20px 22px;
      transform: rotate(0.6deg);
      -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
      mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
    }

    .msg.error .bubble { border-color: var(--chili); color: #a3221a; }

    .bubble p + p, .bubble p + ul, .bubble ul + p, .bubble p + pre, .bubble ul + pre, .bubble pre + p { margin-top: 9px; }
    .bubble ul { padding-left: 20px; }
    .bubble li + li { margin-top: 3px; }
    .bubble li::marker { color: var(--chili); }
    .bubble strong { font-weight: 700; color: var(--navy); }

    .bubble code {
      font-family: var(--ticket);
      font-size: 0.9em;
      background: #e8edf7;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .bubble pre {
      background: var(--ink);
      color: #f0f3fa;
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
    }

    .bubble pre code { background: none; padding: 0; color: inherit; }

    .simmer { display: flex; align-items: flex-end; gap: 8px; padding: 14px 22px 10px; }

    .simmer span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2.5px solid var(--navy);
      animation: rise 1.3s ease-in-out infinite;
    }

    .simmer span:nth-child(2) { animation-delay: 0.25s; }
    .simmer span:nth-child(3) { animation-delay: 0.5s; }

    @keyframes rise {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-9px); opacity: 1; }
    }

    .composer {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding: 14px 24px 22px;
    }

    .composer textarea {
      flex: 1;
      font-family: var(--body);
      font-size: 16.5px;
      line-height: 1.4;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--navy);
      border-radius: 14px;
      padding: 10px 16px;
      resize: none;
      max-height: 130px;
    }

    .composer textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(31, 58, 104, 0.25); }
    .composer textarea::placeholder { color: #8c97a8; }

    .send {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      background: var(--chili);
      border: 3px solid var(--navy);
      border-radius: 14px;
      padding: 9px 24px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--navy);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .send:hover:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--navy); }
    .send:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .send:disabled { opacity: 0.55; cursor: not-allowed; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .kitchen { max-height: none; }
      .head p { display: none; }
      .messages { padding: 16px 14px 8px; }
      .composer { padding: 12px 14px 16px; }
      .msg { max-width: 94%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .simmer span { animation: none; opacity: 1; }
      .slip, .send { transition: none; }
      .messages { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="kitchen">
    <header class="head">
      <div>
        <h1>{{ bot_name }}</h1>
        <p>Culinary study assistant</p>
      </div>
      <button class="reset" id="clearBtn" type="button">Clear the pass</button>
    </header>

    <div class="rail" aria-hidden="true"></div>

    <nav class="hanging" aria-label="Suggested topics">
      <button class="slip" data-prompt="Explain the five French mother sauces and their bases.">Mother sauces</button>
      <button class="slip" data-prompt="What is the Maillard reaction and how do I control it?">Maillard reaction</button>
      <button class="slip" data-prompt="Explain the role of gluten in bread baking.">Gluten in bread</button>
      <button class="slip" data-prompt="What are the basic knife cuts such as julienne, brunoise and chiffonade?">Knife cuts</button>
      <button class="slip" data-prompt="Explain the temperature danger zone and safe food handling.">Danger zone</button>
    </nav>

    <main class="pass">
      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a culinary study question" aria-label="Your question"></textarea>
        <button class="send" id="sendBtn" type="button">Fire</button>
      </div>
    </main>
  </div>

  <script>
    const GREETING = {{ greeting | tojson }};

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let history = [];
    let busy = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function render(text) {
      const lines = text.split("\n");
      let html = "";
      let inList = false;
      let inCode = false;

      for (const raw of lines) {
        if (raw.trim().startsWith("```")) {
          if (inList) { html += "</ul>"; inList = false; }
          html += inCode ? "</code></pre>" : "<pre><code>";
          inCode = !inCode;
          continue;
        }

        if (inCode) {
          html += escapeHtml(raw) + "\n";
          continue;
        }

        const line = raw.trim();
        const item = line.match(/^(?:[-*]|\d+\.)\s+(.*)$/);

        if (item) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(item[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line) html += "<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>";
        }
      }

      if (inList) html += "</ul>";
      if (inCode) html += "</code></pre>";
      return html;
    }

    function addMessage(role, text, isError = false) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role + (isError ? " error" : "");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "user") bubble.textContent = text;
      else bubble.innerHTML = render(text);

      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.innerHTML = '<div class="bubble simmer" aria-label="Simmering"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function setBusy(state) {
      busy = state;
      sendBtn.disabled = state;
    }

    async function send(text) {
      const message = text.trim();
      if (!message || busy) return;

      addMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      setBusy(true);

      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage("bot", data.error || "Something went wrong.", true);
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "user", text: message }, { role: "bot", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("bot", "Could not reach the server. Check your connection and try again.", true);
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage("bot", GREETING);
    }

    sendBtn.addEventListener("click", () => send(inputEl.value));

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(inputEl.value);
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
    });

    clearBtn.addEventListener("click", resetChat);

    document.querySelectorAll(".slip").forEach((button) => {
      button.addEventListener("click", () => send(button.dataset.prompt));
    });

    resetChat();
  </script>
</body>
</html>
